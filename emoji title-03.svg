  <text class="cls-3" transform="translate(23.3 21.7)"><tspan x="0" y="0">ABOUT</tspan></text>
  <text class="cls-4" transform="translate(22.25 51.52)"><tspan x="0" y="0">In today’s digital world, it can </tspan><tspan x="0" y="12">be difficult to express how we </tspan><tspan x="0" y="24">truly feel. Mental health </tspan><tspan x="0" y="36">struggles are often hidden behind </tspan><tspan x="0" y="48">or left unspoken. This website </tspan><tspan x="0" y="60">uses emojis as tools for </tspan><tspan x="0" y="72">awareness, giving users a way to </tspan><tspan x="0" y="84">decorate their photos with symbols </tspan><tspan x="0" y="96">that reflect their emotions. By </tspan><tspan x="0" y="108">turning everyday digital language </tspan><tspan x="0" y="120">into a form of self expression, </tspan><tspan x="0" y="132">the site encourages honest </tspan><tspan x="0" y="144">conversations about mental health </tspan><tspan x="0" y="156">and helps reduce stigma.</tspan></text>
