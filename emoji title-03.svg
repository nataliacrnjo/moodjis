<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 251" xmlns:v="https://vecta.io/nano"><defs><linearGradient id="A" x1="122.5" y1="28" x2="122.5" y2="251" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c2c7d8"/><stop offset=".08" stop-color="#fff"/></linearGradient><linearGradient id="B" x1="122.74" y1="0" x2="122.74" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#bcd5df"/><stop offset=".83" stop-color="#f1fafe"/></linearGradient></defs><path d="M0 28h245v223H0z" fill="url(#A)"/><path d="M.44 0h244.61v28H.44" fill="url(#B)"/><text fill="#677c7c" font-family="CascadiaCodeRoman-Bold,Cascadia Code" font-size="14.84" font-weight="700"><tspan x="23.3" y="21.7">ABOUT</tspan></text><text font-family="CascadiaCode-Regular,Cascadia Code" font-size="10"><tspan x="22.25" y="51.52">In today’s digital world, it can </tspan><tspan y="63.52" x="22.25">be difficult to express how we </tspan><tspan y="75.52" x="22.25">truly feel. Mental health </tspan><tspan y="87.52" x="22.25">struggles are often hidden behind </tspan><tspan y="99.52" x="22.25">or left unspoken. This website </tspan><tspan y="111.52" x="22.25">uses emojis as tools for </tspan><tspan y="123.52" x="22.25">awareness, giving users a way to </tspan><tspan y="135.52" x="22.25">decorate their photos with symbols </tspan><tspan y="147.52" x="22.25">that reflect their emotions. By </tspan><tspan y="159.52" x="22.25">turning everyday digital language </tspan><tspan y="171.52" x="22.25">into a form of self expression, </tspan><tspan y="183.52" x="22.25">the site encourages honest </tspan><tspan y="195.52" x="22.25">conversations about mental health </tspan><tspan y="207.52" x="22.25">and helps reduce stigma.</tspan></text></svg>